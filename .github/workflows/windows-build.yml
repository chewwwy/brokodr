name: Windows installer

# Produces Bro.Kodr-Windows-<version>-Setup.exe on a real Windows runner.
#
# electron-builder cannot cross-compile a Windows NSIS installer from Linux (and a
# code-signed one not at all), which is why this exists: the sandbox this repo was
# built in is Linux, so the .exe step has to happen here.
#
# Run it from the Actions tab (workflow_dispatch) or by pushing a v* tag.

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # The root build typechecks and builds the web bundle into packages/web/dist.
      # packages/desktop/bun run dist needs that to already exist - it only copies it.
      - name: Build web + desktop bundles
        run: bun run build
        env:
          # The app reads these at build time; add any others the web build needs.
          GOOGLE_GENERATIVE_AI_API_KEY: ${{ secrets.GOOGLE_GENERATIVE_AI_API_KEY }}

      - name: Package NSIS installer
        working-directory: packages/desktop
        run: bun run dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # No signing certificate is configured. Unsigned means Windows SmartScreen will
          # warn on first run ("Windows protected your PC" -> More info -> Run anyway).
          # To sign, add CSC_LINK (base64 .pfx) and CSC_KEY_PASSWORD as repo secrets.
          CSC_IDENTITY_AUTO_DISCOVERY: "false"

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: brokodr-windows-installer
          path: |
            packages/desktop/release/*/*.exe
            packages/desktop/release/*/*.blockmap
          if-no-files-found: error
          retention-days: 14
